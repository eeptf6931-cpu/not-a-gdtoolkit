name: Build Geode mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: Win64
            runner: windows-latest
          - name: Android ARM64
            target: Android64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Geode SDK 4.0.0's bundled fmt 11.0.2 hits a Clang 21 consteval
      # regression. Use a known-compatible Clang 19 toolchain on Windows.
      - name: Set up Clang 19
        if: matrix.target == 'Win64'
        uses: egor-tensin/setup-clang@v2
        with:
          version: 19
          platform: x64

      # NDK 27.2 ships Clang 18, avoiding the fmt/Clang 21 consteval issue.
      - name: Set up Java 17
        if: matrix.target == 'Android64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        if: matrix.target == 'Android64'
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          bindings-ref: 01518cec46e0986880569f39a5ebe1a65f783c75
          configure-args: -DGEODE_DISABLE_FMT_CONSTEVAL=ON
          android-ndk-version: ${{ matrix.target == 'Android64' && '27.2.12479018' || '' }}

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: GD-Toolkit-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
