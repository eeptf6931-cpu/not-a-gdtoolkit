name: Build Geode mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: Win64
            runner: windows-latest
          - name: Android ARM64
            target: Android64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: matrix.target == 'Android64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        if: matrix.target == 'Android64'
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.0.13004108

      # Do not pin bindings independently from the SDK: the old pinned commit
      # did not contain headers required by the generated SDK bindings.
      # NDK r28 ships Clang 19, required by the current Geode SDK.
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.target }}
          android-ndk-version: ${{ matrix.target == 'Android64' && '28.0.13004108' || '' }}

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: GD-Toolkit-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
